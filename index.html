<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e12">
<title>Zombie Survival</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="game" id="game">
  <canvas id="canvas"></canvas>

  <header class="hud">
    <div class="hud-item hp">
      <span class="ico">❤️</span>
      <div class="hp-col"><b id="health">100</b><div class="bar"><i id="healthFill"></i></div></div>
    </div>
    <div class="hud-item ammo">
      <span class="ico">🔫</span>
      <div class="ammo-col"><span><b id="ammo">12</b><small id="reserve">/∞</small></span><small id="wname" class="wname"></small></div>
    </div>
    <div class="hud-item sc"><small data-i18n="score">SCORE</small><b id="score">0</b></div>
    <div class="hud-item wv"><small data-i18n="wave">VAGUE</small><b id="wave">1</b></div>
    <button id="btnPause" class="pause" type="button" aria-label="Pause">⏸</button>
  </header>

  <div class="toast" id="toast"></div>

  <div class="controls">
    <div class="joy" id="joy"><div class="joy-knob" id="joyKnob"></div></div>
    <div class="actions">
      <div class="small-row">
        <button id="btnWeapon" class="round small" type="button" aria-label="Arme">🔄</button>
        <button id="btnReload" class="round small" type="button" aria-label="Recharger">↻</button>
      </div>
      <button id="btnFire" class="fire" type="button" aria-label="Tirer"><span>◎</span></button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="ov-card">
      <h2 id="ovTitle"></h2>
      <p id="ovText"></p>
      <p id="ovExtra" class="ov-extra"></p>
      <button id="ovBtn" class="primary" type="button"></button>
      <button id="btnRestart" class="secondary hidden" type="button" data-i18n="restart">RECOMMENCER</button>
      <p id="ovHint" class="ov-hint"></p>
      <div class="ov-tools">
        <button id="btnLang" class="tool" type="button">EN</button>
        <button id="btnMute" class="tool" type="button" aria-label="Son">🔊</button>
      </div>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
