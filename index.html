<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e12">
<title>Dernier Rempart</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="game" id="game">
  <canvas id="canvas"></canvas>

  <header class="hud">
    <div class="hud-item hp">
      <span class="ico">❤️</span>
      <div class="hp-col"><b id="health">100</b><div class="bar"><i id="healthFill"></i></div></div>
    </div>
    <div class="hud-item ammo">
      <span class="ico">🔫</span>
      <div class="ammo-col"><span><b id="ammo">12</b><small id="reserve">/∞</small></span><small id="wname" class="wname"></small></div>
    </div>
    <div class="hud-item sc"><small data-i18n="score">SCORE</small><b id="score">0</b><div class="combo" id="combo"></div></div>
    <div class="hud-item wv"><small data-i18n="wave">VAGUE</small><b id="wave">1</b></div>
    <button id="btnPause" class="pause" type="button" aria-label="Pause">⏸</button>
  </header>

  <div class="buffs" id="buffs"></div>
  <div class="toast" id="toast"></div>

  <div class="controls">
    <div class="joy" id="joy"><div class="joy-knob" id="joyKnob"></div></div>
    <div class="actions">
      <div class="small-row">
        <button id="btnGrenade" class="round small" type="button" aria-label="Grenade">💣<i class="cd" id="grenadeCd"></i></button>
        <button id="btnMode" class="round small mode" type="button" aria-label="Mode de tir">SEMI</button>
        <button id="btnWeapon" class="round small" type="button" aria-label="Arme">🔄</button>
        <button id="btnReload" class="round small" type="button" aria-label="Recharger">↻</button>
      </div>
      <button id="btnFire" class="fire" type="button" aria-label="Tirer"><span>◎</span></button>
    </div>
  </div>

  <div class="loader" id="loader" aria-live="polite">
    <div class="loader-art" style="background-image:url(assets/cover.jpg)"></div>
    <div class="loader-bottom">
      <div class="loader-bar"><i id="loaderFill"></i></div>
      <p id="loaderText">Chargement…</p>
    </div>
  </div>

  <div class="overlay" id="overlay"><div class="ov-card" id="ovCard"></div></div>

  <div class="overlay hidden" id="perkOverlay">
    <div class="ov-card">
      <h2 data-i18n="perkTitle">AMÉLIORATION</h2>
      <p data-i18n="perkSub">Choisis un bonus pour la suite</p>
      <div class="perk-list" id="perkList"></div>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
